# Requirements taken from the contest page, transcribed 2026-10-08 from
# https://sber.ru/sberindex/konkurs_sberindex (HTTP 200, read in this session).
# Quoted in the page's own Russian wording, then given a stable id, so an audit row can cite the
# requirement without paraphrasing it into something easier to satisfy.

source:
  url: "https://sber.ru/sberindex/konkurs_sberindex"
  read: "2026-10-08"
  nomination: "Кластеризация"

deadline:
  accepted_from: "2026-09-14"
  accepted_until: "2026-10-09"
  submission: "fill the form and attach links with view access"

requirements:
  - id: attribute-space
    quote: >-
      сформировать пространство признаков (атрибутов), выбрав подходящие показатели из предложенных
      вариантов, и обосновать свой выбор
    kind: requirement
    status: met
    recheck: after_integration
    evidence:
      - artifacts/features/feature_space_report.json
      - docs/method/attribute-space.md
      - configs/panel.yaml
    note: >-
      The indicator set is being extended by the layers Earth Engine now answers for, so the
      justification has to be re-issued once those columns exist; the requirement itself is met.

  - id: edge-rule-mathematical
    quote: "математически определить правило, по которому между двумя муниципалитетами создаётся связь (ребро)"
    kind: requirement
    status: met
    evidence:
      - configs/edge_rules.yaml
      - artifacts/edges/edge_diagnostics.json
      - artifacts/edges/edge_rules_summary.csv
      - artifacts/edges/warping_family.json
    note: >-
      Seven families, each with a formula, a direction, guards and a sparsification rule. The brief's
      own suggestions are covered: distance between territories, correlation between monthly series,
      cosine similarity of spending vectors, lagged correlation and warping with an offset chosen by the
      data.

  - id: edge-influence
    quote: >-
      обосновать выбранный способ построения рёбер и объяснить, какое влияние он оказывает на структуру
      сети и результаты кластеризации
    kind: requirement
    status: partial
    evidence:
      - artifacts/edges/edge_rules_summary.csv
      - artifacts/edges/warping_family.json
    failure: >-
      The influence on network structure is measured - reciprocity, clustering coefficient, degree gini,
      top-1% adjacency, label-propagation modularity, dense versus kNN component counts - but the
      influence on the clustering result is not. No artifact yet compares cluster quality or
      interpretability with and without edge-derived features, which is the second half of this
      requirement. Task: edge-influence-on-clustering.

  - id: temporal-approach
    quote: "предложить математический подход для отслеживания изменений кластеров во времени"
    kind: requirement
    status: met
    evidence:
      - artifacts/dynamics/dynamics_summary.json
      - artifacts/dynamics/monthly_clusters.json
      - artifacts/dynamics/assignments_kmeans.parquet
      - docs/method/temporal-dynamics.md
    note: >-
      Monthly re-clustering with label churn and agreement against the aggregate partition, plus a
      maximal-overlap alignment for moving labels. The cadence of the inputs says spending updates
      monthly, so a monthly reading of the clusters is the one the data supports.

  - id: cluster-quality-meaning
    quote: >-
      оценить качество полученных кластеров, дать им содержательную интерпретацию и обосновать их
      экономическую осмысленность
    kind: requirement
    status: partial
    evidence:
      - artifacts/icvi/method_comparison.csv
      - artifacts/interpretation/cluster_fingerprints.csv
      - artifacts/interpretation/cluster_names.json
      - artifacts/validation/k_sweep_summary.json
      - artifacts/validation/meaningfulness_rule.json
    failure: >-
      Quality indices and a naming attempt exist, and a decision rule for "meaningfully different" was
      fixed before the experiments ran. What is missing is the verdict itself: whether the clusters can
      be named and defended rather than described as a list of unrelated characteristics, and whether the
      chosen k is the one the evidence supports. Tasks: sweep-k-interpretability, recluster-at-vintages.

  - id: source-glad-tree-cover
    quote: >-
      Допускается интеграция ... любых надёжных и публично доступных источников информации (the brief
      permits extra sources; this one was named by us, not by the page)
    kind: source
    status: deferred_by_decision
    recheck: never
    failure: >-
      Dropped by the user's decision on 2026-10-08, not by failure of the source. Every identifier tried
      for it returns "not found": UMD/GLAD_/TREECOVER/CIRCUITRY/2020v1 and
      UMD/gladsat-foundation-data-v1, measured in artifacts/geo/asset_id_probe.json under the newly
      registered project. No requirement of the clustering nomination depends on it, so further identifier
      hunting was judged not worth the quota.

  - id: source-intact-forest-landscapes
    quote: >-
      Допускается интеграция ... любых надёжных и публично доступных источников информации (named by us,
      not by the page)
    kind: source
    status: deferred_by_decision
    recheck: never
    failure: >-
      Dropped by the user's decision on 2026-10-08. GLAD/IFL/2021 and UMD/ifl_2021 both return "not
      found" under the registered project, measured in artifacts/geo/asset_id_probe.json. Nothing in the
      nomination requires intact-forest boundaries, and the land-production story is carried by cropland,
      grass and forest shares from classified land cover.

    note: >-
      The task page sharpens this requirement: the clusters must be interpreted as real types of local
      economies, not merely as groups that differ statistically. That is what the interpretability verdict
      in the k sweep has to answer, and it is why a cluster that cannot be named is reported as unnamed
      rather than being given a label drawn from whichever characteristics happen to differ.

  - id: criterion-methodology-explanation
    quote: "Простое и понятное объяснение разработанной методологии — 15%"
    kind: criterion
    status: met
    evidence:
      - README.md
      - docs/method/master-table-and-geometry.md
      - docs/method/covariates.md
      - docs/method/edge-rules.md

  - id: criterion-network-attribute-structure
    quote: "Описание того, как строится сетевая и атрибутивная структура, — 15%"
    kind: criterion
    status: met
    evidence:
      - docs/method/edge-rules.md
      - docs/method/attribute-space.md
      - artifacts/edges/edge_diagnostics.json
    note: >-
      The listed options are all present in some form. Dynamic Time Warping was the one missing and was
      added on 2026-10-08 as dynamic_alignment.

  - id: criterion-temporal-approach
    quote: >-
      математический подход к отслеживанию изменений кластеров во времени — 15% (the task page lists this
      as a scored criterion; the summary on the contest page lists "Сравнение методов — 15%" in the third
      slot instead. Both are carried, because the two lists differ and neither can be assumed to supersede
      the other.)
    kind: criterion
    status: met
    evidence:
      - artifacts/dynamics/dynamics_summary.json
      - artifacts/dynamics/monthly_clusters.json
      - artifacts/dynamics/drift_kmeans.csv
      - docs/method/temporal-dynamics.md
    note: >-
      The same artifact serves this criterion and the fourth listed requirement. Monthly re-clustering,
      label churn, agreement with the aggregate partition and a maximal-overlap alignment for moving
      labels are all measured rather than described.

  - id: criterion-method-comparison
    quote: "Сравнение методов — 15%"
    kind: criterion
    status: partial
    evidence:
      - artifacts/icvi/method_comparison.csv
    failure: >-
      The comparison covers k-means and Ward against the same index battery. The top-ranked competitor
      runs seven methods across an eleven-value k range, so a two-method comparison is thin against the
      criterion's own wording. Recorded as a named gap rather than presented as sufficient.

  - id: criterion-icvi-battery
    quote: "Применение ICVI: SW, CH, S_Dbw, AVI, AVU, MQ — 15%"
    kind: criterion
    status: met
    evidence:
      - artifacts/icvi/method_comparison.csv
      - src/sberindex/icvi.py
    note: >-
      All six named indices are computed; the attribute-based ones on the feature matrix and the
      graph-based ones on the adjacency matrix. This was checked by reading the artifact's columns rather
      than by trusting the docstring.

  - id: criterion-interpretation-reproducibility
    quote: >-
      Интерпретация результатов, ясность, воспроизводимость и обоснованность выводов — 30%
    kind: criterion
    status: partial
    evidence:
      - artifacts/MANIFEST.sha256
      - artifacts/interpretation/cluster_profile.csv
      - artifacts/validation/input_cadence.json
    failure: >-
      Reproducibility is measured - a manifest with byte-level verification and a model build that was
      shown to reproduce the committed artifacts. Interpretation and justification are what this goal
      exists to settle, so the row stays partial until the k sweep, the vintage comparison and the
      imputation test are measured.

  - id: criterion-innovative-visualization
    quote: "Предложение инновационной визуализации — 10%"
    kind: criterion
    status: deferred_by_decision
    failure: >-
      Out of scope for this goal by the user's decision: submission preparation, including visualization
      and any landing or presentation, moves to a separate goal that replaces the dropped frontend one.
      Recorded as deferred rather than unmet, so the score risk is visible instead of silent.

  - id: deliverable-code-configs-instructions
    quote: >-
      Чистый, хорошо документированный код: репозиторий GitHub; конфигурационные файлы (YAML/JSON) для
      настройки гиперпараметров; инструкцию по запуску проекта
    kind: deliverable
    status: met
    evidence:
      - README.md
      - run_all.sh
      - configs/clustering.yaml
      - configs/edge_rules.yaml
      - configs/panel.yaml
      - configs/dynamics.yaml

  - id: deliverable-methodology-report-ru
    quote: "Краткий методологический отчёт, написанный на русском языке"
    kind: deliverable
    status: met
    recheck: after_integration
    evidence:
      - docs/report/methodology-ru.md
    note: >-
      It exists and is in Russian. It will not describe the integrated Earth Engine layers until they are
      built, and it must not claim otherwise; the update belongs to the submission goal.

  - id: deliverable-presentation
    quote: >-
      Презентацию в формате pdf или интерактивного лендинга с экономической интерпретацией результатов и
      визуализацией итогов
    kind: deliverable
    status: deferred_by_decision
    failure: >-
      Deferred to the separate submission goal by the user's decision. The print/export view was retired on
      2026-10-09 together with the step-based presentation it belonged to (docs/presentation-structure-2026.md);
      the committed figure renders still survive under artifacts/landing/figures/ and the manifest that names them.

  - id: mandatory-sberindex-dataset
    quote: "Обязательным условием является использование минимум одного датасета СберИндекса"
    kind: requirement
    status: met
    evidence:
      - artifacts/landing/map_timeline.json
      - docs/method/attribute-space.md
    note: >-
      Municipal consumer spending by category, monthly 2023-01 to 2024-12, is the core input, alongside
      the municipality reference with Oktmo identifiers.

  - id: allowed-extra-sources
    quote: >-
      Допускается интеграция новостных источников, климатических и погодных данных, других экономических
      индикаторов или любых надёжных и публично доступных источников информации
    kind: requirement
    status: met
    recheck: after_integration
    evidence:
      - configs/gee_sources.yaml
      - configs/fallback_sources.yaml
      - artifacts/geo/covariates_diagnostics.json
      - artifacts/geo/added_layers_measures.json
    note: >-
      Remote sensing, official Rosstat statistics and OpenStreetMap geometry are integrated. GDELT news
      is named but not wired, and two sources - GLAD tree cover and Intact Forest Landscapes - are
      dropped by the user's decision rather than by failure.
