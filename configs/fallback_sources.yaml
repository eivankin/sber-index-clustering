# Registry of the no-auth fallback covariate stack (scripts/build_covariates_fallback.py).
# These sources were verified reachable without credentials from this machine.

gls_lc:
  product: Copernicus Global Land Service - Land Cover 100m, collection 3, epoch 2015-2019
  file: PROBAV_LC100_global_v3.0.1_2019-nrt_Discrete-Classification-map_EPSG-4326.tif
  url: https://zenodo.org/api/records/3939050/files/PROBAV_LC100_global_v3.0.1_2019-nrt_Discrete-Classification-map_EPSG-4326.tif/content
  resolution_m: 100
  denominator: classified pixels only; gls_unclassified_pct reported per territory
  license: CC BY 4.0
  citation: 'VITO / EOC, "Copernicus Global Land Service: Land Cover 100m collection 3", https://doi.org/10.5281/zenodo.3939050'

gls_urban:
  product: GLS-LC100 Built-Up cover fraction layer (same record)
  file: PROBAV_LC100_global_v3.0.1_2019-nrt_BuiltUp-CoverFraction-layer_EPSG-4326.tif
  resolution_m: 100
  statistic: mean over classified pixels; built-up density per km2 uses Rosstat land area
  license: CC BY 4.0
  citation: same as gls_lc

gls_water:
  product: GLS-LC100 Permanent Water cover fraction layer (same record)
  file: PROBAV_LC100_global_v3.0.1_2019-nrt_PermanentWater-CoverFraction-layer_EPSG-4326.tif
  resolution_m: 100
  license: CC BY 4.0
  citation: same as gls_lc

gls_change:
  product: GLS-LC100 collection 3 epoch 2015-2019 change-confidence band (same Zenodo record)
  file: PROBAV_LC100_global_v3.0.1_2019-nrt_Change-Confidence-layer_EPSG-4326.tif
  resolution_m: 100
  statistic: share of a territory's classified pixels carrying a change flag, plus the mean change
    confidence; this is the layer used to test whether the physical fingerprint moved with a
    spending-type transition
  role: geospatial consistency check for temporal-dynamics
  license: CC BY 4.0
  citation: same as gls_lc
gls_forest_type:
  product: GLS-LC100 Forest Type layer (broadleaved / needleleaved / mixed / unknown)
  file: PROBAV_LC100_global_v3.0.1_2019-nrt_Forest-Type-layer_EPSG-4326.tif
  resolution_m: 100
  denominator: classified pixels only; gls_forest_unclassified_pct reported per territory
  license: CC BY 4.0
  citation: same as gls_lc

dem:
  product: Copernicus DEM GLO-30 (Digital Surface Model, 1 arc-second COG tiles)
  url_pattern: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N{lat}_00_E{lon}_00_DEM/Copernicus_DSM_COG_10_N{lat}_00_E{lon}_00_DEM.tif
  access: public S3 bucket, read through /vsicurl windowed reads, nothing stored on disk
  resolution_m: 30
  aggregation: tile-wise, pixel-count weighted (mean exact, median is a weighted approximation)
  license: Copernicus DEM - made available by Airbus Defence and Space under a free-of-charge
    licence for the Copernicus programme; see https://dataspace.copernicus.eu
  citation: Copernicus Global Digital Elevation Model, GLO-30, European Union / Copernicus

unavailable_without_credentials:
  - 'VIIRS DNB annual composites: eogdata.mines.edu redirects to eogauth.mines.edu (Keycloak login); AWS noaa-jpss carries only raw SDR granules and BHP fire products, no cloud-free DNB composites. Substitute in this stack: GLS built-up fraction as the demand-density proxy.'
  - 'Hansen Global Forest Change: reachable anonymously through the GCS JSON API (bucket earthenginepartners-hansen, prefix Annual_Layers_2015_2024/TCH/<year>/), but the tiles are 10x10 degrees at ~84 MB median, so covering Russia needs ~7 GB for a single year. Deferred; forest share comes from GLS-LC100 classes and ESA WorldCover tree classes instead.'
  - 'WorldClim: biogeo.ucdavis.edu / data.worldclim.org are not resolvable from this host. Available through Earth Engine (WORLDCLIM/V1/BIO, an Image, 19 bands) - used in the GEE pipeline.'
  - 'SoilGrids: neither the Earth Engine asset (ISRIC/soilgrids, ISRIC/soigrid) nor the WCS endpoint (maps.isric.org map paths rejected by msLoadMap) is reachable here; per-tile files are browsable at files.isric.org/soilgrids/latest/data but 1129 tiles per layer is too much for the deadline.'

